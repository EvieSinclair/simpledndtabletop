<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roles Hub Matrix</title>
    <style>
        body { margin: 0; font-family: 'Georgia', serif; background: #111; color: #d4c5b9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .vault-card { background: #1c1814; border: 2px solid #3d2b1f; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #d4b375; margin-top: 0; font-size: 1.8rem; border-bottom: 1px solid #3d2b1f; padding-bottom: 10px; }
        .role-btn { display: block; width: 100%; padding: 12px; margin: 15px 0; background: #3d2b1f; border: 1px solid #d4b375; color: #ecd09b; font-weight: bold; font-size: 1rem; border-radius: 4px; cursor: pointer; text-decoration: none; box-sizing: border-box;}
        .role-btn:hover { background: #d4b375; color: #111; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #111; border: 1px solid #3d2b1f; color: white; border-radius: 4px; box-sizing: border-box; text-align: center; }
    </style>
</head>
<body>

    <div class="vault-card">
        <h1># ROLES.MD</h1>
        <p>Select your operational table alignment configuration clearance level:</p>
        
        <!-- Launch the Master DM frame layout directly inside its nested directory folder -->
        <button class="role-btn" onclick="window.location.href='dm/dashboard.html'">[ DM Clearance Portal ]</button>
        
        <div style="margin: 25px 0; border-top: 1px dashed #3d2b1f;"></div>
        
        <!-- Player Unique Code & Credentials Pad Verification -->
        <input type="text" id="player-name" placeholder="Character Name (e.g. Valeros)">
        <input type="text" id="room-code" placeholder="Enter DM Unique Passcode Key...">
        <button class="role-btn" style="background:#5c1e13; border-color:#7a3e35; color:white;" onclick="launchPlayer()">[ Connect Character Node ]</button>
    </div>

    <script>
        function launchPlayer() {
            const name = document.getElementById('player-name').value.trim();
            const code = document.getElementById('room-code').value.trim();
            if (!name || !code) { alert("Please input both Character Name and DM Access Passcode!"); return; }
            
            // Forward variables down to the active player module using URL parameter vectors
            window.location.href = `player.html?name=${encodeURIComponent(name)}&room=${encodeURIComponent(code)}`;
        }
    </script>
</body>
</html>
