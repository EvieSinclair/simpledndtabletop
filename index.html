<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campaign Portal - Login</title>
    <style>
        body { 
            margin: 0; font-family: 'Georgia', serif; 
            background: #111 url('https://unsplash.com') no-repeat center center fixed; 
            background-size: cover; display: flex; align-items: center; justify-content: center; height: 100vh; 
        }
        .login-card { 
            background: rgba(30, 25, 20, 0.95); padding: 40px; border-radius: 8px; 
            border: 2px solid #3d2b1f; text-align: center; color: #d4c5b9; box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(5px);
        }
        h2 { color: #d4b375; margin-top: 0; letter-spacing: 1px; }
        .btn { padding: 12px 28px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-dm { background: #d4b375; color: #111; }
        .btn-dm:hover { background: #ecd09b; }
        .btn-player { background: #5c1e13; color: white; }
        .btn-player:hover { background: #7a3e35; }
        input[type="text"] { padding: 12px; border-radius: 4px; border: 1px solid #3d2b1f; background: #111; color: white; width: 220px; text-align: center; font-size: 1rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>CAMPAIGN PORTAL</h2>
        <p>Select your table operating clearance:</p>
        
        <!-- Routes directly to your standalone DM file -->
        <button class="btn btn-dm" onclick="window.location.href='dm.html'">Host as Dungeon Master</button>
        
        <div style="margin: 20px 0; border-top: 1px solid #3d2b1f;"></div>
        
        <!-- Routes directly to your standalone Player file with their code attached -->
        <input type="text" id="code-input" placeholder="Enter DM Room Code..."><br>
        <button class="btn btn-player" onclick="joinAsPlayer()">Join as Party Player</button>
    </div>

    <script>
        function joinAsPlayer() {
            const code = document.getElementById('code-input').value.trim();
            if (!code) {
                alert("Please enter a DM Room Code first!");
                return;
            }
            // Pass the typed code to the player page using a standard URL parameter
            window.location.href = `player.html?room=${code}`;
        }
    </script>
</body>
</html>
