<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Vault VTT</title>
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #1e1e1e; color: #dcddde; display: flex; flex-direction: column; height: 100vh; }
        nav { background: #2f3136; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 50px; border-bottom: 1px solid #202225; }
        .nav-brand { font-weight: bold; color: #44adff; }
        .nav-links { display: flex; gap: 5px; }
        .nav-btn { background: none; border: none; color: #b9bbbe; padding: 15px 20px; font-size: 0.95rem; cursor: pointer; }
        .nav-btn.active { color: #fff; border-bottom: 2px solid #44adff; background: #36393f; }
        #connection-bar { background: #000; font-size: 0.8rem; padding: 4px 20px; text-align: right; color: #e67e22; font-weight: bold; }

        #content-area { flex-grow: 1; position: relative; }
        .tab-panel { display: none; height: calc(100vh - 78px); }
        .tab-panel.active { display: block; }

        .vault-layout { display: flex; height: 100%; }
        .file-tree-sidebar { width: 260px; background: #2f3136; border-right: 1px solid #202225; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        .editor-view { flex-grow: 1; display: flex; flex-direction: column; padding: 25px; background: #36393f; overflow-y: auto; }
        
        .tree-folder { font-weight: bold; color: #f8b63e; margin: 8px 0 4px 0; cursor: pointer; user-select: none; }
        .tree-file { padding: 4px 12px; color: #b9bbbe; cursor: pointer; border-radius: 4px; font-size: 0.95rem; }
        .tree-file:hover, .tree-file.active { background: #40444b; color: #fff; }
        .tree-children { margin-left: 15px; border-left: 1px solid #4f545c; padding-left: 10px; }

        .md-workspace { display: flex; gap: 20px; flex-grow: 1; height: 85%; }
        textarea { flex: 1; background: #2f3136; color: #fff; border: 1px solid #202225; border-radius: 4px; padding: 15px; font-family: monospace; font-size: 1rem; resize: none; }
        .md-preview { flex: 1; background: #2f3136; border: 1px solid #202225; border-radius: 4px; padding: 15px; overflow-y: auto; }
        .md-preview h1, .md-preview h2 { color: #fff; border-bottom: 1px solid #4f545c; padding-bottom: 4px; }

        .canvas-container { display: flex; justify-content: center; align-items: center; height: 100%; background: #23272a; }
        canvas { background: #111; border: 1px solid #4f545c; border-radius: 4px; }
        
        .setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; }
        .btn { padding: 12px 24px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #44adff; color: white; margin: 5px; }
        input[type="text"] { padding: 12px; border-radius: 4px; border: 1px solid #4f545c; background: #2f3136; color: white; width: 250px; text-align: center; font-size: 1rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">Obsidian-Style VTT Dashboard</div>
        <div class="nav-links hidden" id="main-navigation">
            <button class="nav-btn active" onclick="switchTab('tab-notes', this)">Markdown Notebook</button>
            <button class="nav-btn" onclick="switchTab('tab-map', this)">Tactical Map</button>
        </div>
    </nav>
    <div id="connection-bar">System Offline</div>

    <div id="content-area">
        <!-- Setup Screen -->
        <div id="setup-panel" class="tab-panel active">
            <div class="setup-screen">
                <h2>Initialize Campaign Vault</h2>
                <div style="text-align: center;">
                    <button class="btn" onclick="initDM()">1. Host as Dungeon Master</button>
                </div>
                <hr style="width: 300px; border-color: #444; margin: 20px 0;">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <input type="text" id="join-room-id" placeholder="Paste DM Room ID here...">
                    <button class="btn" style="background:#43b581;" onclick="initPlayer()">2. Join as Player</button>
                </div>
            </div>
        </div>

        <!-- Markdown Vault Tab -->
        <div id="tab-notes" class="tab-panel">
            <div class="vault-layout">
                <div class="file-tree-sidebar" id="sidebar-tree"></div>
                <div class="editor-view">
                    <h2 id="active-file-title" style="margin-top:0; color:#fff;">Select a file from your vault</h2>
                    <div class="md-workspace">
                        <textarea id="markdown-editor" class="hidden" oninput="handleMarkdownEdit(this.value)" placeholder="Write your markdown formatting here..."></textarea>
                        <div id="markdown-preview" class="md-preview">Select an .md file to preview its content.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Tab -->
        <div id="tab-map" class="tab-panel">
            <div class="canvas-container">
                <canvas id="vttCanvas" width="700" height="500"></canvas>
            </div>
        </div>
    </div>

    <script>
        let role = null; let peer = null; let conn = null;
        let activeFilePath = ["Campaign Notes", "Session 1 Summary.md"];

        let gameState = {
            tokenX: 100, tokenY: 100,
            vault: {
                "Campaign Notes": {
                    type: "folder",
                    children: {
                        "Session 1 Summary.md": { type: "file", content: "# Session 1 Summary\nThe party arrived at the town of Phandalin.\n\n### Active Quests\n- [ ] Investigate the sleeping dragon.\n- [x] Buy health potions." },
                        "World Lore.md": { type: "file", content: "# World History\nThe land was shaped 2,000 years ago during the *Great Cataclysm*." }
                    }
                },
                "Monsters & NPCs": {
                    type: "folder",
                    children: {
                        "Goblin Boss.md": { type: "file", content: "### Klarg the Goblin\n**Armor Class:** 13\n**Hit Points:** 22\n\n- Scimitar Attack (+4 to hit)" }
                    }
                }
            }
        };

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(id === 'tab-map') renderMap();
        }

        // --- HOST AS DM ---
        function initDM() {
            role = 'DM';
            setupUI();

            // Leaving this blank makes PeerJS give us a completely random, unique ID
            peer = new Peer(); 
            
            peer.on('open', id => {
                document.getElementById('connection-bar').style.color = "#ffaa00";
                document.getElementById('connection-bar').innerText = `DM Mode | Copy this ID for Players: ${id}`;
                console.log("DM Peer initialized with ID:", id);
            });

            peer.on('connection', c => {
                conn = c;
                handleConnect();
            });
        }

        // --- JOIN AS PLAYER ---
        function initPlayer() {
            role = 'Player';
            const dmId = document.getElementById('join-room-id').value.trim();
            if (!dmId) {
                alert("Please enter the DM's Room ID code first!");
                return;
            }

            setupUI();
            document.getElementById('connection-bar').innerText = "Linking to Campaign Server...";
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(dmId);
                conn.on('open', () => {
                    handleConnect();
                });
            });
        }

        function setupUI() {
            document.getElementById('setup-panel').classList.remove('active');
            document.getElementById('main-navigation').classList.remove('hidden');
            document.getElementById('tab-notes').classList.add('active');
            
            if (role === 'DM') {
                document.getElementById('markdown-editor').classList.remove('hidden');
            } else {
                document.getElementById('markdown-editor').classList.add('hidden');
            }
            buildFileTreeUI();
            openFile();
        }

        function handleConnect() {
            document.getElementById('connection-bar').style.color = "#43b581";
            document.getElementById('connection-bar').innerText = "Sync Connected & Active";
            setupDataListener();
            if (role === 'DM') sync();
        }

        function setupDataListener() {
            conn.on('data', data => {
                if (data.type === 'SYNC') {
                    gameState = data.state;
                    buildFileTreeUI();
                    
                    const fileObj = getFileFromPath(activeFilePath);
                    if (fileObj) {
                        document.getElementById('markdown-preview').innerHTML = marked.parse(fileObj.content);
                        if (role === 'DM') document.getElementById('markdown-editor').value = fileObj.content;
                    }
                    renderMap();
                }
            });
        }

        function sync() { 
            if (conn && conn.open) {
Use code with caution.
conn.send({ type: 'SYNC', state: gameState });
}
}
function buildFileTreeUI() {
const container = document.getElementById('sidebar-tree');
container.innerHTML = 'Vault Navigation';
function parseNode(obj, parentElement, currentPathArr) {
Object.keys(obj).forEach(key => {
const node = obj[key];
const nextPath = [...currentPathArr, key];
if (node.type === 'folder') {
const folderDiv = document.createElement('div');
folderDiv.className = 'tree-folder';
folderDiv.innerText = 📁 ${key};
parentElement.appendChild(folderDiv);
const childContainer = document.createElement('div');
childContainer.className = 'tree-children';
parentElement.appendChild(childContainer);
parseNode(node.children, childContainer, nextPath);
} else {
const fileDiv = document.createElement('div');
fileDiv.className = 'tree-file';
fileDiv.innerText = 📄 ${key};
if (JSON.stringify(nextPath) === JSON.stringify(activeFilePath)) fileDiv.classList.add('active');
fileDiv.onclick = () => {
activeFilePath = nextPath;
document.querySelectorAll('.tree-file').forEach(f => f.classList.remove('active'));
fileDiv.classList.add('active');
openFile();
};
parentElement.appendChild(fileDiv);
}
});
}
parseNode(gameState.vault, container, []);
}
function getFileFromPath(pathArr) {
let current = gameState.vault;
for (let i = 0; i < pathArr.length; i++) {
if (i === pathArr.length - 1) return current[pathArr[i]];
current = current[pathArr[i]].children;
}
return null;
}
function openFile() {
const fileObj = getFileFromPath(activeFilePath);
if (!fileObj) return;
document.getElementById('active-file-title').innerText = activeFilePath[activeFilePath.length - 1];
document.getElementById('markdown-editor').value = fileObj.content;
document.getElementById('markdown-preview').innerHTML = marked.parse(fileObj.content);
}
function handleMarkdownEdit(text) {
const fileObj = getFileFromPath(activeFilePath);
if (fileObj) {
fileObj.content = text;
document.getElementById('markdown-preview').innerHTML = marked.parse(text);
sync();
}
}
/* Canvas Map Logic /
const canvas = document.getElementById('vttCanvas'); const ctx = canvas.getContext('2d'); let drag = false;
function renderMap() {
ctx.clearRect(0,0,700,500); ctx.fillStyle="#333"; ctx.fillRect(0,0,700,500);
ctx.beginPath(); ctx.arc(gameState.tokenX, gameState.tokenY, 20, 0, Math.PI2);
ctx.fillStyle="#44adff"; ctx.fill(); ctx.stroke();
}
canvas.addEventListener('mousedown', e => drag = true);
canvas.addEventListener('mousemove', e => {
if(!drag) return; const r = canvas.getBoundingClientRect();
gameState.tokenX = e.clientX - r.left; gameState.tokenY = e.clientY - r.top;
renderMap(); sync();
});
canvas.addEventListener('mouseup', () => drag = false);
