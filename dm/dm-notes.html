<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 20px; background: #221a14; color: #dcddde; font-family: monospace; height: calc(100vh - 40px); display: flex; flex-direction: column; box-sizing: border-box;}
        textarea { width: 100%; flex-grow: 1; background: #111; color: #fff; border: 1px solid #3d2b1f; padding: 15px; font-size: 1rem; resize: none; border-radius: 4px; box-sizing: border-box; }
        h3 { color: #d4b375; margin-top:0; }
    </style>
</head>
<body>
    <h3>[ EDITOR CORE: DM-NOTES.MD ]</h3>
    <textarea id="editor" oninput="sendNotesUp(this.value)"></textarea>

    <script>
        const master = window.parent;
        if(master && master.getGameState) {
            document.getElementById('editor').value = master.getGameState().campaignNotes;
        }
        function sendNotesUp(text) {
            if(master && master.updateGameStateNotes) master.updateGameStateNotes(text);
        }
        function syncFromMaster(state) {
            // Only force update value if the cursor isn't currently engaged inside the textarea box
            if(document.activeElement !== document.getElementById('editor')) {
                document.getElementById('editor').value = state.campaignNotes;
            }
        }
        window.syncFromMaster = syncFromMaster;
    </script>
</body>
</html>
